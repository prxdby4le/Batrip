services:
  web:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: .
      args:
        BASE_IMAGE: mirror.gcr.io/library/php:8.2-apache
    container_name: batrip-web
    restart: unless-stopped
    ports:
      - "8080:80"
    # Variáveis de ambiente (valores padrão definidos, podem ser sobrescritos por .env se existir)
    # O .env será criado automaticamente pelo entrypoint do container se não existir
    environment:
      APP_ENV: docker
      BASE_URL: http://localhost:8080/
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: batrip
      DB_USER: batrip_user
      DB_PASS: batrip_pass_2024
      # APIs - Carregadas do .env ou valores padrão vazios
      SUPERFRETE_TOKEN: ${SUPERFRETE_TOKEN:-}
      SUPERFRETE_CEP_ORIGEM: ${SUPERFRETE_CEP_ORIGEM:-04696906}
      SUPERFRETE_SERVICES: ${SUPERFRETE_SERVICES:-1,2}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
    volumes:
      - ./:/var/www/html
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini:ro
    depends_on:
      - db

  db:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: batrip-db
    command: ["--default-authentication-plugin=mysql_native_password"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: batrip
      MYSQL_USER: batrip_user
      MYSQL_PASSWORD: batrip_pass_2024
    volumes:
      - db_data:/var/lib/mysql
      - ./database/batrip_full.sql:/docker-entrypoint-initdb.d/01-batrip_full.sql:ro
      - ./database/init_orders.sql:/docker-entrypoint-initdb.d/02-init_orders.sql:ro
      - ./database/create_payments_table.sql:/docker-entrypoint-initdb.d/03-create_payments_table.sql:ro
      - ./database/create_payments_table.sql:/docker-entrypoint-initdb.d/03-create_payments_table.sql:ro
    ports:
      - "3307:3306"

  phpmyadmin:
    image: mirror.gcr.io/library/phpmyadmin:5.2.0
    container_name: batrip-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_ARBITRARY: 1
      PHPMYADMIN_ALLOW_NO_PASSWORD: "yes"
      UPLOAD_LIMIT: 64M
      PMA_AUTH_TYPE: "config"
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    ports:
      - "8081:80"

volumes:
  db_data:
