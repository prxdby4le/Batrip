version: "3.8"

services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: mirror.gcr.io/library/php:8.2-apache
    container_name: batrip-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: batrip
      DB_USER: batrip_user
      DB_PASS: batrip_pass_2024
    volumes:
      - ./:/var/www/html
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini:ro
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: batrip-db
    command: ["--default-authentication-plugin=mysql_native_password"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: batrip
      MYSQL_USER: batrip_user
      MYSQL_PASSWORD: batrip_pass_2024
    volumes:
      - db_data:/var/lib/mysql
      - ./database/batrip.sql:/docker-entrypoint-initdb.d/01-batrip.sql:ro
      - ./database/batrip_alter_users.sql:/docker-entrypoint-initdb.d/02-batrip_alter_users.sql:ro
      - ./database/03-products.sql:/docker-entrypoint-initdb.d/03-products.sql:ro
      - ./database/04-add-is_admin-and-orders.sql:/docker-entrypoint-initdb.d/04-add-is_admin-and-orders.sql:ro
    ports:
      - "3307:3306"

  phpmyadmin:
    image: quay.io/bitnami/phpmyadmin:latest
    container_name: batrip-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      DATABASE_HOST: db
      DATABASE_PORT_NUMBER: 3306
      PHPMYADMIN_ALLOW_NO_PASSWORD: "no"
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    ports:
      - "8081:80"

volumes:
  db_data:
