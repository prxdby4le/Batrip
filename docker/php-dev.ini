; PHP dev overrides to ensure immediate code reloads
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.max_accelerated_files=10000
opcache.enable_cli=1

; Development friendly settings (comentado para produção)
; display_errors=On
; error_reporting=E_ALL
; Para desenvolvimento, descomente as linhas acima
display_errors=Off
error_reporting=E_ALL & ~E_NOTICE & ~E_WARNING

; Sessões PHP para Docker
session.save_path="/tmp"
upload_max_filesize = 1024M
post_max_size = 1024M
