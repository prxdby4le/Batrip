<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Serve uploads folder (outside DocumentRoot)
    Alias /uploads /var/www/html/uploads
    <Directory /var/www/html/uploads>
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    # Serve assets folder (inside DocumentRoot)
    # Assets estão em /var/www/html/public/assets/, então não precisa de Alias
    # O DocumentRoot já cobre esse caminho

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers (duplicated with PHP headers, harmless)
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "no-referrer-when-downgrade"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://www.mercadolibre.com https://www.mercadolivre.com; connect-src 'self' https://viacep.com.br https://api.mercadopago.com https://api.mercadolibre.com https://www.mercadolibre.com https://www.mercadolivre.com; frame-src 'self' https://www.mercadopago.com https://www.mercadolibre.com https://www.mercadolivre.com; frame-ancestors 'self';"
    </IfModule>
</VirtualHost>
